version: '3.8'

services:
  db:
    image: ankane/pgvector:latest
    container_name: photoflow_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: localpassword123
      POSTGRES_DB: photoflow_db
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:alpine
    container_name: photoflow_redis
    restart: always
    ports:
      - "6379:6379"

volumes:
  postgres_data: